name: CI

# Unit tests, lint and a debug build on every push and pull request. The signed release APK is
# built separately by release.yml when a GitHub release is published.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A pull request branch triggers both a push run and a pull request run for the same commit;
# they share a group, so only the newest one keeps running.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Caches the Gradle distribution, dependencies and build cache between runs.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The local speech library (native/speech, whisper.cpp) is built with the NDK and CMake that
      # app/build.gradle.kts pins; the runner's SDK may hold other versions (licences are accepted).
      - name: Install the NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      - name: Restore development signing key
        id: development-signing
        if: github.event_name == 'push' && github.repository == 'MarkSohmer/Vicu-Mobile' && github.ref == 'refs/heads/feature/project-grouped-widget'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 is unset. This APK uses a temporary debug key."
            exit 0
          fi
          umask 077
          key_path="$RUNNER_TEMP/vicu-dev.jks"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          cert_sha=$(keytool -exportcert -keystore "$key_path" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          echo "VICU_DEV_KEYSTORE=$key_path" >> "$GITHUB_ENV"
          echo "cert_sha=$cert_sha" >> "$GITHUB_OUTPUT"
          echo "stable=true" >> "$GITHUB_OUTPUT"

      # compileCommonMainKotlinMetadata compiles the shared code without the Android classpath, so
      # an Android or JVM-only API in commonMain fails here, on every push, without a Mac.
      - name: Test, lint, check common code and build the debug APK
        run: |
          chmod +x gradlew
          ./gradlew test lint :shared:compileCommonMainKotlinMetadata assembleDebug

      - name: Sign and verify development APK
        if: steps.development-signing.outputs.stable == 'true'
        env:
          EXPECTED_CERT_SHA: ${{ steps.development-signing.outputs.cert_sha }}
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          apk=app/build/outputs/apk/debug/app-debug.apk
          signed="$RUNNER_TEMP/vicu-dev-signed.apk"
          "$apksigner" sign --ks "$VICU_DEV_KEYSTORE" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android --out "$signed" "$apk"
          report=$("$apksigner" verify --print-certs "$signed")
          actual=$(awk '/^Signer #1 certificate SHA-256 digest:/ {print tolower($NF)}' <<< "$report")
          if [ "$actual" != "$EXPECTED_CERT_SHA" ]; then
            echo "::error::APK certificate $actual differs from expected $EXPECTED_CERT_SHA."
            exit 1
          fi
          mv "$signed" "$apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.development-signing.outputs.stable == 'true' && 'vicu-dev-updateable' || 'vicu-dev-temporary-signing' }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
